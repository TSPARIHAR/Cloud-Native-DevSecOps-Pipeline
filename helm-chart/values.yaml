replicaCount: 1

image:
  repository: tsparihar/flask-redis-app
  pullPolicy: IfNotPresent
  tag: "17"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false

httpRoute:
  enabled: false

resources: {}
autoscaling:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}

# Probes must hit /health route (returns 200 even without Redis)
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
