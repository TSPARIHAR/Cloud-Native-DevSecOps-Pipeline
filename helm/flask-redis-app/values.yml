replicaCount: 2

image:
  repository: your-dockerhub-username/flask-redis-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

env:
  redisHost: "redis-service"
  redisPort: "6379"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5

redis:
  enabled: true
  image: redis:7.2-alpine
  port: 6379
